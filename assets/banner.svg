<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%" style="background:#070b14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9b51e0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="400" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="640" y1="0" x2="640" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
  </g>

  <!-- Ambient Light Orbs (Background dynamic elements) -->
  <circle cx="180" cy="120" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="280" r="160" fill="#9b51e0" opacity="0.09" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="90" r="100" fill="#ff007a" opacity="0.06" filter="url(#glow)">
    <animate attributeName="opacity" values="0.04;0.10;0.04" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Background Molecular Network Lattice -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="90" y1="90" x2="170" y2="150" />
    <line x1="170" y1="150" x2="130" y2="240" />
    <line x1="130" y1="240" x2="60" y2="280" />
    <line x1="130" y1="240" x2="220" y2="300" />
    <line x1="170" y1="150" x2="260" y2="110" />

    <line x1="1020" y1="80" x2="1100" y2="130" />
    <line x1="1100" y1="130" x2="1190" y2="100" />
    <line x1="1100" y1="130" x2="1080" y2="220" />
    <line x1="1080" y1="220" x2="1160" y2="280" />
    <line x1="1080" y1="220" x2="1000" y2="260" />
    <line x1="1160" y1="280" x2="1240" y2="250" />
  </g>

  <!-- Animated Molecular Nodes -->
  <g fill="#38bdf8" filter="url(#softGlow)">
    <circle cx="90" cy="90" r="5">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="150" r="6">
      <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="130" cy="240" r="5">
      <animate attributeName="r" values="4;6.5;4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="60" cy="280" r="4" />
    <circle cx="220" cy="300" r="5" />
    <circle cx="260" cy="110" r="4.5" />

    <circle cx="1020" cy="80" r="4.5" />
    <circle cx="1100" cy="130" r="7">
      <animate attributeName="r" values="6;9;6" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1190" cy="100" r="5" />
    <circle cx="1080" cy="220" r="6" />
    <circle cx="1160" cy="280" r="5.5">
      <animate attributeName="r" values="4.5;7.5;4.5" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="260" r="4" />
    <circle cx="1240" cy="250" r="4.5" />
  </g>

  <!-- Left Dynamic Floating Tech Badges (Non-overlapping, placed on flanks) -->
  <g id="floating-pills">
    <!-- Pill 1: AlphaFold 3 -->
    <g transform="translate(60, 335)">
      <animateTransform attributeName="transform" type="translate" values="60,335; 60,330; 60,335" dur="4s" repeatCount="indefinite" />
      <rect width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="30" y="18" fill="#e2e8f0" font-size="12" font-weight="600">AlphaFold 3</text>
    </g>

    <!-- Pill 2: Boltz-2 -->
    <g transform="translate(205, 335)">
      <animateTransform attributeName="transform" type="translate" values="205,335; 205,340; 205,335" dur="4.8s" repeatCount="indefinite" />
      <rect width="100" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
      <circle cx="15" cy="14" r="5" fill="#a855f7" />
      <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="600">Boltz-2</text>
    </g>

    <!-- Pill 3: Chai-1 -->
    <g transform="translate(970, 335)">
      <animateTransform attributeName="transform" type="translate" values="970,335; 970,330; 970,335" dur="4.2s" repeatCount="indefinite" />
      <rect width="95" height="28" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
      <circle cx="15" cy="14" r="5" fill="#ec4899" />
      <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="600">Chai-1</text>
    </g>

    <!-- Pill 4: RFdiffusion -->
    <g transform="translate(1080, 335)">
      <animateTransform attributeName="transform" type="translate" values="1080,335; 1080,340; 1080,335" dur="5s" repeatCount="indefinite" />
      <rect width="135" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#10b981" />
      <text x="30" y="18" fill="#e2e8f0" font-size="12" font-weight="600">RFdiffusion</text>
    </g>
  </g>

  <!-- Animated DNA Wave Curve at Top Edge (Subtle dynamic biotech wave) -->
  <path d="M 0,20 Q 160,5 320,20 T 640,20 T 960,20 T 1280,20" fill="none" stroke="url(#dnaGrad)" stroke-width="2.5" opacity="0.5">
    <animate attributeName="d" 
      values="M 0,20 Q 160,5 320,20 T 640,20 T 960,20 T 1280,20;
              M 0,20 Q 160,35 320,20 T 640,20 T 960,20 T 1280,20;
              M 0,20 Q 160,5 320,20 T 640,20 T 960,20 T 1280,20" 
      dur="7s" repeatCount="indefinite" />
  </path>
  <path d="M 0,20 Q 160,35 320,20 T 640,20 T 960,20 T 1280,20" fill="none" stroke="url(#dnaGrad)" stroke-width="1.5" opacity="0.3">
    <animate attributeName="d" 
      values="M 0,20 Q 160,35 320,20 T 640,20 T 960,20 T 1280,20;
              M 0,20 Q 160,5 320,20 T 640,20 T 960,20 T 1280,20;
              M 0,20 Q 160,35 320,20 T 640,20 T 960,20 T 1280,20" 
      dur="7s" repeatCount="indefinite" />
  </path>

  <!-- ================= FOREGROUND (HIGH Z-ORDER / ALWAYS CRISP & CLEAR) ================= -->
  <!-- Top Category Chip -->
  <g transform="translate(640, 72)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">🔬 AI FOR STRUCTURAL BIOLOGY &amp; TECHBIO</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(640, 150)">
    <!-- Shadow for depth -->
    <text x="0" y="2" text-anchor="middle" fill="#000000" font-size="44" font-weight="900" letter-spacing="-0.5" opacity="0.6">Awesome Structural Biology AI</text>
    <text x="0" y="0" text-anchor="middle" fill="url(#accentCyan)" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#softGlow)">Awesome Structural Biology AI</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(640, 198)">
    <text x="0" y="0" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="500">
      Biomolecular Foundation Models • Protein Structure Prediction • Molecular Docking
    </text>
  </g>

  <!-- Tagline / Value Proposition -->
  <g transform="translate(640, 235)">
    <text x="0" y="0" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="400">
      Curated directory of industry SaaS platforms and open-source foundation models transforming drug discovery
    </text>
  </g>

  <!-- Feature Pill Tags in Center Foreground -->
  <g transform="translate(640, 280)">
    <!-- Pill A -->
    <g transform="translate(-250, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">🧬 All-Atom Folding</text>
    </g>
    <!-- Pill B -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">💊 Binding Affinity</text>
    </g>
    <!-- Pill C -->
    <g transform="translate(90, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">🎯 Ligand Docking</text>
    </g>
    <!-- Pill D -->
    <g transform="translate(255, 0)">
      <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">⚡ De Novo Design</text>
    </g>
  </g>
</svg>
